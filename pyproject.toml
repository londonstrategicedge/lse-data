[build-system]
requires = ["hatchling>=1.21,<1.28"]
build-backend = "hatchling.build"

[project]
name = "lse-data"
version = "3.0.1"
description = "Python client for London Strategic Edge market data: live streaming, LSE Data 3.0 history as CSV and Parquet with checksum-verified downloads, macro and reference data, options chains and flow"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "London Strategic Edge", email = "support@londonstrategicedge.com" },
]
keywords = ["trading", "market data", "websocket", "stocks", "crypto", "forex", "options", "futures", "realtime", "parquet", "csv", "level 2", "level 3"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "websockets>=11.0",
]

[project.optional-dependencies]
# DataFrames: history(), dataset() and load() return pandas DataFrames with
# this extra; without it, pass dataframe=False to get the file's path.
frames = ["pyarrow>=14", "pandas>=1.5"]

[project.scripts]
lse = "lse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lse"]

[tool.hatch.build.targets.sdist]
include = ["lse", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[project.urls]
Homepage = "https://londonstrategicedge.com"
Documentation = "https://github.com/londonstrategicedge/lse-data/blob/main/docs/api.md"
Repository = "https://github.com/londonstrategicedge/lse-data"
Issues = "https://github.com/londonstrategicedge/lse-data/issues"
